<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OF4S LinkedIn Cover</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<style>
  html, body { margin: 0; background: var(--of4s-navy-900); }
  /* Canvas: 2100×350 CSS px, exported at 2× → 4200×700 (6:1, LinkedIn company cover) */
  .cover {
    position: relative; width: 2100px; height: 350px; overflow: hidden;
    background: var(--of4s-navy-900); color: var(--of4s-paper-50);
    display: grid; grid-template-columns: 520px 1fr 900px; align-items: center;
    padding: 0; column-gap: 0; box-sizing: border-box;
  }
  /* Quiet floor-plan hairlines — architectural texture, no photo */
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(143,169,199,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(143,169,199,0.07) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: linear-gradient(to right, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 30%, rgba(0,0,0,0) 62%);
  }
  /* Oversized ghost "4" — echoes the mark */
  .ghost {
    position: absolute; left: 150px; top: -150px;
    font-family: var(--of4s-font-display); font-weight: 300;
    font-size: 620px; line-height: 1; letter-spacing: -0.04em;
    color: var(--of4s-navy-800);
  }
  .copy { grid-column: 2; position: relative; padding-right: 60px; }
  .photo { grid-column: 3; align-self: stretch; position: relative;
    background: var(--photo) right 78% / cover no-repeat;
    clip-path: polygon(110px 0, 100% 0, 100% 100%, 0 100%); }
  .eyebrow {
    font-family: var(--of4s-font-mono); font-size: 15px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--of4s-navy-300); margin-bottom: 22px;
  }
  h1 {
    margin: 0; font-family: var(--of4s-font-display); font-weight: 300;
    font-size: 76px; line-height: 0.98; letter-spacing: -0.035em; color: var(--of4s-paper-50);
  }
  h1 em { font-style: normal; font-weight: 400; color: var(--of4s-navy-300); }
  .services {
    display: flex; gap: 18px; align-items: center; margin-top: 28px;
    font-family: var(--of4s-font-mono); font-size: 15px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--of4s-paper-200);
  }
  .services .sep { width: 6px; height: 6px; border-radius: 50%; background: var(--of4s-navy-500); }
</style>
</head>
<body>
  <div class="cover" style="--photo:url(photos/open-office.webp)">
    <div class="grid"></div>
    <div class="ghost">4</div>
    <div class="copy">
      <div class="eyebrow">Commercial office furniture</div>
      <h1>From floor plan<br>to finished <em>space.</em></h1>
      <div class="services"><span>Design</span><span class="sep"></span><span>Furnish</span><span class="sep"></span><span>Install</span></div>
    </div>
    <div class="photo"></div>
  </div>
</body>
</html>
