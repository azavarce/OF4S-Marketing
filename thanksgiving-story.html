<title>OF4S Thanksgiving Story</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 9:16 Instagram Story frame. Greeting, autumn stripe wipe, OF4S logo card. Loops every 11s. */
:root{
  --navy-950:#0a1628; --navy-900:#0f1d33; --navy-800:#15273f; --navy-600:#2d4a6e; --navy-300:#8fa9c7;
  --paper:#faf8f4; --paper-200:#e8e2d4;
  --pumpkin:#d9772b; --harvest:#e3a845; --cranberry:#a8392e; --brown:#6b3f24; --olive:#6f8a4f; --brass:#c9a474;
  --display:'Schibsted Grotesk','Geist',sans-serif;
  --sans:'Geist',-apple-system,system-ui,sans-serif;
  --mono:'Geist Mono','SF Mono',Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy-950);color:var(--paper);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.story{position:relative;width:min(100%,405px,calc((100vh - 90px) * 9 / 16));aspect-ratio:9/16;max-width:100%;
  overflow:hidden;border-radius:14px;container-type:inline-size;box-shadow:0 18px 40px rgba(0,0,0,.4);
  background:radial-gradient(110% 70% at 50% 105%,rgba(217,119,43,.28) 0%,rgba(168,57,46,.12) 35%,transparent 65%),
             radial-gradient(120% 80% at 50% 0%,var(--navy-600) 0%,var(--navy-800) 45%,var(--navy-950) 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}

/* Scene 1 */
.greet{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8cqw;gap:5cqw}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:10.4cqw;line-height:1;letter-spacing:-.035em;white-space:nowrap}
h2 .line{display:block}
h2 .ch{display:inline-block}
h2 .warm .ch:nth-child(4n+1){color:var(--pumpkin)} h2 .warm .ch:nth-child(4n+2){color:var(--harvest)}
h2 .warm .ch:nth-child(4n+3){color:var(--brass)}   h2 .warm .ch:nth-child(4n){color:var(--pumpkin)}
.dots{display:flex;gap:2.4cqw}
.dots i{width:3.2cqw;height:3.2cqw;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--pumpkin)} .dots i:nth-child(2){background:var(--harvest)}
.dots i:nth-child(3){background:var(--cranberry)} .dots i:nth-child(4){background:var(--olive)}
.msg{font-family:var(--sans);font-weight:300;font-size:4.6cqw;line-height:1.4;color:var(--paper-200);max-width:30ch;margin:0}
.sign{font-family:var(--sans);font-weight:500;font-size:4cqw;color:var(--navy-300)}

/* Scene 2: logo card */
.card{position:absolute;inset:0;background:var(--navy-900);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7cqw}
.lockup{display:flex;flex-direction:column;align-items:center;gap:4cqw}
.m5{display:inline-flex;font-family:var(--display);font-weight:700;font-size:22cqw;letter-spacing:-.03em;line-height:.9;color:var(--paper)}
.m5 .four{color:var(--navy-300)}
.lockup .rule{width:1px;align-self:stretch;background:rgba(255,255,255,.25);transform-origin:top}
.fullname{font-family:var(--mono);font-size:3.6cqw;letter-spacing:.14em;color:var(--paper-200);line-height:1.9}
.url{font-family:var(--mono);font-size:3cqw;letter-spacing:.06em;color:var(--navy-300)}
.url b{color:var(--paper);font-weight:500}
.card .dots{gap:2cqw} .card .dots i{width:2cqw;height:2cqw}

.btn{font:500 13px var(--sans);background:transparent;color:var(--navy-300);border:1px solid var(--navy-600);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

/* ── Timeline (11s loop): greeting 0–6.6s, autumn stripe wipe, logo card ~7–11s ── */
.wipe i{position:absolute;inset:-25% -15%;display:block;transform:translateY(140%) skewY(-14deg)}
.wipe i:nth-child(1){background:var(--harvest)} .wipe i:nth-child(2){background:var(--pumpkin)} .wipe i:nth-child(3){background:var(--brown)}
.anim .greet{animation:greetOut 11s infinite}
.anim h2 .ch{animation:pop 11s infinite both;animation-delay:.1s}
.anim .msg{animation:fadeup 11s infinite .1s both}
.anim .sign{animation:fadeup 11s infinite .1s both}
.anim .wipe i{animation:wipe 11s infinite both}
.anim .wipe i:nth-child(2){animation-delay:.06s} .anim .wipe i:nth-child(3){animation-delay:.12s}
.anim .card{animation:cardIn 11s infinite both}
.anim .card .m5 span{animation:slam 11s infinite both}
.anim .card .fullname{animation:cardFade 11s infinite both}

@keyframes pop{0%{opacity:0;transform:translateY(60%) rotate(-12deg) scale(.6)}3.3%{opacity:1;transform:translateY(-12%) rotate(4deg) scale(1.08)}5.3%,100%{opacity:1;transform:none}}
@keyframes fadeup{0%{opacity:0;transform:translateY(10px)}4.9%,100%{opacity:1;transform:none}}
@keyframes greetOut{0%,59.9%{opacity:1;transform:none}61.9%,100%{opacity:0;transform:translateY(-6%)}}
@keyframes wipe{0%,59.1%{transform:translateY(140%) skewY(-14deg)}61.9%,63.2%{transform:translateY(0) skewY(-14deg)}66.5%,100%{transform:translateY(-140%) skewY(-14deg)}}
@keyframes cardIn{0%,63.6%{opacity:0}64%,96%{opacity:1}100%{opacity:0}}
@keyframes slam{0%,65.25%{opacity:0;transform:scale(2.4);filter:blur(8px)}68.1%{opacity:1;transform:scale(.94);filter:blur(0)}69.7%,100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes cardFade{0%,65.25%{opacity:0;letter-spacing:.6em}69.6%,100%{opacity:1;letter-spacing:.14em}}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}.card,.wipe{display:none}}
</style>

<div class="wrap">
  <div class="story anim" id="story" role="img" aria-label="Happy Thanksgiving from the OF4S team: from our team to yours, thank you for another great year. Ends on the OF4S logo card.">
    <canvas id="c"></canvas>
    <div class="greet">
      <h2><span class="line" data-split>Happy</span><span class="line warm" data-split>Thanksgiving</span></h2>
      <p class="msg">From our team to yours, thank you to every client, partner and friend for another great year.</p>
      <div class="sign">The OF4S Team</div>
    </div>
    <div class="card">
      <div class="lockup">
        <span class="m5"><span style="--i:0">OF</span><span class="four" style="--i:1">4</span><span style="--i:2">S</span></span>
        <span class="fullname">officefurniture4sale</span>
      </div>
    </div>
    <div class="wipe" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <button class="btn" id="replay" type="button">Replay</button>
</div>

<script>
let n=0;document.querySelectorAll('[data-split]').forEach(el=>{const t=el.textContent;el.textContent='';
  for(const c of t){const s=document.createElement('span');s.className='ch';s.textContent=c;s.style.setProperty('--i',n++);el.appendChild(s)}});
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLORS=['#d9772b','#e3a845','#a8392e','#6f8a4f','#c9a474'];
let W,H,leaves=[],t0=performance.now();
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
function leaf(init){return{x:Math.random()*W,y:init?Math.random()*H:-20,s:6+Math.random()*11,v:.35+Math.random()*.7,
  a:Math.random()*6.28,r:(Math.random()-.5)*.04,sw:Math.random()*6.28,o:.55+Math.random()*.4,c:COLORS[Math.random()*5|0],
  maple:Math.random()<.45,flip:Math.random()*6.28}}
function maple(s){ctx.beginPath();for(let i=0;i<=10;i++){const ang=-Math.PI/2+i*Math.PI/5,r=i%2?s*.45:s;ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r)}ctx.closePath();ctx.fill()}
function oval(s){ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(s*.7,0,0,s);ctx.quadraticCurveTo(-s*.7,0,0,-s);ctx.fill()}
function draw(l){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.a);ctx.scale(Math.cos(l.flip),1);ctx.globalAlpha=l.o;ctx.fillStyle=l.c;
  l.maple?maple(l.s):oval(l.s);ctx.restore()}
function tick(now){ctx.clearRect(0,0,W,H);const p=((now-t0)%11000)/11000;
  const gust=p>.575&&p<.64?2.6:1; // leaves sweep faster as the logo card opens
  for(const l of leaves){l.y+=l.v*gust;l.sw+=.02;l.x+=Math.sin(l.sw)*.6*gust;l.a+=l.r;l.flip+=.03;
    if(l.y>H+20)Object.assign(l,leaf(false));draw(l)}
  if(!reduce)requestAnimationFrame(tick)}
size();leaves=Array.from({length:30},()=>leaf(true));requestAnimationFrame(tick);
addEventListener('resize',size);
document.getElementById('replay').onclick=()=>{const s=document.getElementById('story');s.classList.remove('anim');void s.offsetWidth;s.classList.add('anim');t0=performance.now()};
</script>
