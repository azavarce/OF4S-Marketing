<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Geist'; src: url('assets/geist-sans-latin-500-normal.woff') format('woff'); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #15273f; }
      #main { position: relative; width: 100%; height: 100%; }
      #end-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #1e3554 0%, #15273f 55%, #0f1d33 100%); }
      #end-wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #end-mask { position: relative; width: 660px; height: 240px; overflow: hidden; }
      #end-logo { position: absolute; left: 0; top: 0; width: 660px; height: 240px; object-fit: contain; }
      #end-shine { position: absolute; top: -20px; left: 0; width: 140px; height: 280px; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%); }
      #end-rule { width: 420px; height: 8px; border-radius: 4px; background: #8fa9c7; margin-top: 46px; transform-origin: 50% 50%; }
      #end-url { margin-top: 38px; font-family: 'Geist'; font-weight: 500; font-size: 40px; color: #faf8f4; letter-spacing: .06em; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
      <div id="end-bg" class="clip" data-start="0" data-duration="2.6" data-track-index="0"></div>
      <div id="end-wrap" class="clip" data-start="0" data-duration="2.6" data-track-index="1">
        <div id="end-mask"><img id="end-logo" src="assets/of4s-mark.png" /><div id="end-shine"></div></div>
        <div id="end-rule"></div>
        <div id="end-url">officefurniture4sale.com</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#end-logo", { y: 240, opacity: 1 }, { y: 0, duration: 0.55, ease: "power4.out" }, 0.15);
      tl.fromTo("#end-mask", { scale: 1.12 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 0.15);
      tl.fromTo("#end-shine", { x: -200 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 0.75);
      tl.fromTo("#end-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.6);
      tl.fromTo("#end-url", { opacity: 0, y: 20, scale: 1.15 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
