<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'SG'; font-weight: 900; src: url('assets/schibsted-grotesk-latin-900-normal.woff') format('woff'); }
      @font-face { font-family: 'SG'; font-weight: 800; src: url('assets/schibsted-grotesk-latin-800-normal.woff') format('woff'); }
      @font-face { font-family: 'Geist'; font-weight: 500; src: url('assets/geist-sans-latin-500-normal.woff') format('woff'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #15273f; }
      #main { position: relative; width: 100%; height: 100%; }
      #end-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #1e3554 0%, #15273f 55%, #0f1d33 100%); }
      #brand { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #end-mask { position: relative; width: 560px; height: 204px; overflow: hidden; }
      #end-logo { position: absolute; left: 0; top: 0; width: 560px; height: 204px; object-fit: contain; }
      #end-shine { position: absolute; top: -20px; left: 0; width: 120px; height: 240px; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%); }
      #end-rule { width: 360px; height: 7px; border-radius: 4px; background: #8fa9c7; margin-top: 40px; transform-origin: 50% 50%; }
      #end-url { margin-top: 32px; font-family: Geist; font-weight: 500; font-size: 36px; color: #faf8f4; letter-spacing: .06em; }
      #cta { position: absolute; left: 150px; top: 560px; width: 820px; }
      #cta-title { font-family: SG; font-weight: 900; font-size: 76px; color: #faf8f4; line-height: 1.05; }
      #cta-sub { margin-top: 22px; font-family: Geist; font-weight: 500; font-size: 36px; color: #8fa9c7; line-height: 1.35; }
      #cta-btn { margin-top: 40px; display: inline-block; padding: 22px 60px; border-radius: 40px; background: #FF0000; color: #ffffff; font-family: SG; font-weight: 800; font-size: 34px; letter-spacing: .06em; }
      #yt-slot { position: absolute; left: 1060px; top: 330px; width: 710px; height: 400px; border: 4px solid #1e3554; border-radius: 16px; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="end-bg" class="clip" data-start="0" data-duration="20" data-track-index="0"></div>
      <div id="yt-slot" class="clip" data-start="0" data-duration="20" data-track-index="1"></div>
      <div id="brand" class="clip" data-start="0" data-duration="20" data-track-index="2">
        <div id="end-mask"><img id="end-logo" src="assets/of4s-mark.png" /><div id="end-shine"></div></div>
        <div id="end-rule"></div>
        <div id="end-url">officefurniture4sale.com</div>
      </div>
      <div id="cta" class="clip" data-start="0" data-duration="20" data-track-index="3">
        <div id="cta-title">Thanks for watching</div>
        <div id="cta-sub">Subscribe for more conversations with<br/>South Florida business leaders.</div>
        <div id="cta-btn">SUBSCRIBE</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // same reveal as the reels
      tl.fromTo("#end-logo", { y: 204 }, { y: 0, duration: 0.55, ease: "power4.out" }, 0.15);
      tl.fromTo("#end-mask", { scale: 1.12 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 0.15);
      tl.fromTo("#end-shine", { x: -180 }, { x: 680, duration: 0.6, ease: "power2.inOut" }, 0.75);
      tl.fromTo("#end-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.6);
      tl.fromTo("#end-url", { opacity: 0, y: 20, scale: 1.15 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.8);
      // then the brand block moves up-left to make room for the call to action
      tl.to("#brand", { x: -580, y: -250, scale: 0.62, duration: 0.9, ease: "power3.inOut" }, 2.6);
      tl.fromTo("#cta-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.2);
      tl.fromTo("#cta-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.4);
      tl.fromTo("#cta-btn", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 3.7);
      tl.fromTo("#yt-slot", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.6);
      tl.to("#end-bg", { opacity: 1, duration: 16 }, 4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
