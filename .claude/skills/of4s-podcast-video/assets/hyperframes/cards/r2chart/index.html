<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'SG'; font-weight: 800; src: url('assets/schibsted-grotesk-latin-800-normal.woff') format('woff'); }
      @font-face { font-family: 'Geist'; font-weight: 500; src: url('assets/geist-sans-latin-500-normal.woff') format('woff'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #faf8f4; }
      #main { position: relative; width: 100%; height: 100%; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #ffffff 0%, #faf8f4 60%, #f3efe7 100%); }
      #wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #label { position: absolute; left: 0; width: 1080px; top: 470px; text-align: center; font-family: 'SG'; font-weight: 800; font-size: 92px; color: #15273f; letter-spacing: -0.01em; }
      #chart { position: absolute; left: 110px; top: 640px; width: 860px; height: 700px; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="1.4" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="1.4" data-track-index="0"></div>
      <div id="wrap" class="clip" data-start="0" data-duration="1.4" data-track-index="1">
        <div id="label">Great Recession</div>
        <svg id="chart" viewBox="0 0 860 700">
          <g stroke="#dde5ee" stroke-width="3">
            <line x1="40" y1="140" x2="840" y2="140"/><line x1="40" y1="300" x2="840" y2="300"/><line x1="40" y1="460" x2="840" y2="460"/>
          </g>
          <line id="axis" x1="40" y1="640" x2="840" y2="640" stroke="#8fa9c7" stroke-width="6" stroke-linecap="round"/>
          <path id="area" d="M40,520 L170,470 L300,440 L420,350 L520,250 L600,560 L700,610 L840,590 L840,640 L40,640 Z" fill="#dde5ee" opacity="0"/>
          <path id="rise" d="M40,520 L170,470 L300,440 L420,350 L520,250" fill="none" stroke="#15273f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="crash" d="M520,250 L600,560 L700,610 L840,590" fill="none" stroke="#15273f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <circle id="peak" cx="520" cy="250" r="16" fill="#15273f"/>
          <g id="arrow" transform="translate(640,330)"><path d="M0,0 L0,120 M-34,86 L0,124 L34,86" fill="none" stroke="#8fa9c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
        </svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const len = (id) => document.getElementById(id).getTotalLength();
      const R = len("rise"), C = len("crash");
      gsap.set("#rise", { strokeDasharray: R, strokeDashoffset: R });
      gsap.set("#crash", { strokeDasharray: C, strokeDashoffset: C });
      // line climbs, then crashes on "Great Recession" (+0.56 s)
      tl.fromTo("#label", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
      tl.to("#rise", { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, 0.02);
      tl.fromTo("#peak", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 0.46);
      tl.to("#crash", { strokeDashoffset: 0, duration: 0.32, ease: "power3.in" }, 0.56);
      tl.to("#area", { opacity: 0.9, duration: 0.3 }, 0.8);
      tl.fromTo("#arrow", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.82);
      tl.fromTo("#wrap", { x: 0 }, { x: 0, keyframes: { x: [0, -10, 9, -6, 4, 0] }, duration: 0.22, ease: "none" }, 0.88);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
