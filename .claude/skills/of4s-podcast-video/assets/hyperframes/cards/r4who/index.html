<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #card { position: absolute; left: 110px; top: 850px; width: 860px; height: 580px; border-radius: 28px; background: #faf8f4; box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #15273f; }
.w { position: absolute; left: 0; width: 860px; text-align: center; font-size: 150px; letter-spacing: .04em; }
#who { top: 70px; color: #15273f; } #what { top: 300px; color: #8fa9c7; }
#strike { position: absolute; left: 190px; top: 400px; width: 480px; height: 14px; border-radius: 7px; background: #15273f; transform-origin: 0 50%; }
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="1.4" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="1.4" data-track-index="0"><div id="card">
<div class="w" id="who">WHO</div><div class="w" id="what">WHAT</div><div id="strike"></div>
</div></div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
gsap.set(["#what","#strike"], { opacity: 0 });
tl.fromTo("#card", { scale: 0.6, y: 80, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.22, ease: "back.out(1.7)" }, 0.0);
tl.fromTo("#who", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2.5)" }, 0.28);
tl.fromTo("#what", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.18 }, 0.86);
tl.fromTo("#strike", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power3.out", immediateRender: false }, 1.02);
tl.to("#card", { scale: 0.92, y: 30, opacity: 0, duration: 0.16, ease: "power2.in" }, 1.24);
window.__timelines["main"] = tl;
</script></body></html>
