<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #stage { perspective: 1400px; }
.card { position: absolute; border-radius: 28px; background: #faf8f4; box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #15273f; }
.lab { font-size: 30px; letter-spacing: .12em; color: #466489; }
.red { color: #d64545; } .green { color: #2fb36a; } .navy { color: #15273f; } .muted { color: #8fa9c7; }
#card{left:110px;top:1080px;width:860px;height:330px}
.row{position:absolute;left:50px;width:760px;height:80px;font-size:40px;line-height:80px;border-bottom:3px solid #dde5ee}
.row b{float:right;font-size:52px}
#r1{top:30px} #r2{top:118px} #r3{top:206px;border-bottom:none}
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="3.4" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="3.4" data-track-index="0">
<div class="card" id="card"><div class="row" id="r1">Could have paid <b class="green">$1,500</b></div><div class="row" id="r2">Paid for a bluff <b class="red">$2,500</b></div><div class="row" id="r3">At risk every year <b class="red">$250K</b></div></div>
</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IN = (sel, t) => tl.fromTo(sel, { rotationX: 70, y: 220, scale: 0.85, opacity: 0 }, { rotationX: 0, y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
const OUT = (sel, t) => tl.to(sel, { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, t);
const POP = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, t);
gsap.set(["#r1","#r2","#r3"],{opacity:0});
IN("#card",0.0); POP("#r1",0.25); POP("#r2",1.05); POP("#r3",1.85);
OUT("#card",3.18);
window.__timelines["main"] = tl;
</script></body></html>
