<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #stage { perspective: 1400px; }
.card { position: absolute; border-radius: 28px; background: #faf8f4; box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #15273f; }
.lab { font-size: 30px; letter-spacing: .12em; color: #466489; }
.red { color: #d64545; } .green { color: #2fb36a; } .navy { color: #15273f; } .muted { color: #8fa9c7; }
#card{left:140px;top:1100px;width:800px;height:280px}
#hd{position:absolute;left:0;width:800px;top:30px;text-align:center}
#a{position:absolute;left:40px;top:96px;width:300px;text-align:center;font-size:84px;line-height:1.1;color:#8fa9c7}
#ar{position:absolute;left:350px;top:110px;width:100px;text-align:center;font-size:70px;color:#466489}
#b{position:absolute;left:460px;top:96px;width:300px;text-align:center;font-size:84px;line-height:1.1;color:#2fb36a}
.u{display:block;font-size:30px;letter-spacing:.12em;color:#466489;margin-top:4px}
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="2.8" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="2.8" data-track-index="0">
<div class="card" id="card"><div id="hd" class="lab">SAME TASK, WITH AI</div><div id="a">2<span class="u">HOURS</span></div><div id="ar">&#8594;</div><div id="b">30<span class="u">MINUTES</span></div></div>
</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IN = (sel, t) => tl.fromTo(sel, { rotationX: 70, y: 220, scale: 0.85, opacity: 0 }, { rotationX: 0, y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
const OUT = (sel, t) => tl.to(sel, { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, t);
const POP = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, t);
gsap.set(["#a","#ar","#b"],{opacity:0});
IN("#card",0.0); POP("#a",0.67);
tl.fromTo("#ar",{opacity:0,x:-30},{opacity:1,x:0,duration:0.25,ease:"power3.out",immediateRender:false},1.45);
POP("#b",1.75);
OUT("#card",2.58);
window.__timelines["main"] = tl;
</script></body></html>
