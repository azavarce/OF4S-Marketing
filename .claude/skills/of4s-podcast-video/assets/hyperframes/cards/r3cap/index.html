<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'SG'; font-weight: 800; src: url('assets/schibsted-grotesk-latin-800-normal.woff') format('woff'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #main { position: relative; width: 100%; height: 100%; }
      /* floating card, lower part of the frame (below faces, inside the IG/TikTok safe zone) */
      #card { position: absolute; left: 110px; top: 860px; width: 860px; height: 570px; border-radius: 28px; background: #faf8f4;
              box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; }
      #hdr { position: absolute; left: 0; width: 860px; top: 26px; display: flex; justify-content: center; align-items: center; gap: 16px;
             font-family: 'SG'; font-weight: 800; font-size: 40px; color: #466489; }
      #hdr svg { width: 34px; height: 40px; }
      #caplbl { position: absolute; left: 600px; top: 112px; font-family: 'SG'; font-weight: 800; font-size: 44px; letter-spacing: .08em; color: #15273f; }
      #ceil { position: absolute; left: 150px; top: 134px; width: 430px; height: 10px; border-radius: 5px; background: #15273f; transform-origin: 0 50%; }
      .track { position: absolute; top: 156px; width: 150px; height: 300px; border-radius: 16px; background: #dde5ee; overflow: hidden; }
      #tE { left: 170px; } #tM { left: 410px; }
      .fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; border-radius: 16px; background: #15273f; transform-origin: 50% 100%; }
      #fM { background: #466489; }
      .lbl { position: absolute; top: 474px; width: 220px; text-align: center; font-family: 'SG'; font-weight: 800; font-size: 42px; color: #15273f; }
      #lE { left: 135px; } #lM { left: 375px; }
      #arrow { position: absolute; left: 330px; top: 285px; width: 70px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="3.25" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="3.25" data-track-index="0">
        <div id="card">
          <div id="hdr"><svg viewBox="-34 -96 68 140"><circle cx="0" cy="-58" r="30" fill="#466489"/><path d="M-34,40 C-34,-6 -20,-20 0,-20 C20,-20 34,-6 34,40 Z" fill="#466489"/></svg><span>Doing it all yourself</span></div>
          <div id="ceil"></div><div id="caplbl">CAP</div>
          <div class="track" id="tE"><div class="fill" id="fE"></div></div>
          <div class="track" id="tM"><div class="fill" id="fM"></div></div>
          <svg id="arrow" viewBox="0 0 70 40"><path d="M4,20 L58,20 M44,7 L60,20 L44,33" fill="none" stroke="#8fa9c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="lbl" id="lE">Energy</div>
          <div class="lbl" id="lM">Money</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // card in (0) · CAP line drops in on "cap" (+0.10) · Energy hits it on "energy" (+1.05) · arrow (+2.25) · Money hits it on "money" (+2.70) · out (+3.05)
      tl.fromTo("#card", { scale: 0.6, y: 80, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.25, ease: "back.out(1.7)" }, 0.0);
      tl.fromTo("#hdr", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25 }, 0.05);
      tl.fromTo("#ceil", { scaleX: 0, y: -30 }, { scaleX: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.10);
      tl.fromTo("#caplbl", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.18);
      tl.fromTo("#lE", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.55);
      tl.fromTo("#fE", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power2.in" }, 0.60);
      tl.fromTo("#ceil", { y: 0 }, { keyframes: { y: [0, -10, 4, -2, 0] }, duration: 0.3, ease: "none", immediateRender: false }, 1.05);
      tl.fromTo("#arrow", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, 2.25);
      tl.fromTo("#lM", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.2);
      tl.fromTo("#fM", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power2.in" }, 2.25);
      tl.fromTo("#ceil", { y: 0 }, { keyframes: { y: [0, -10, 4, -2, 0] }, duration: 0.3, ease: "none", immediateRender: false }, 2.70);
      tl.to("#card", { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, 3.05);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
