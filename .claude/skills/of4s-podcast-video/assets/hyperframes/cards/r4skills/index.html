<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #card { position: absolute; left: 110px; top: 850px; width: 860px; height: 580px; border-radius: 28px; background: transparent; box-shadow: none; text-shadow: 0 4px 14px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.5); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #faf8f4; }
#hdr { position: absolute; left: 0; width: 860px; top: 28px; text-align: center; font-size: 38px; color: #faf8f4; }
.row { position: absolute; left: 150px; height: 74px; display: flex; align-items: center; gap: 26px; font-size: 46px; }
.box { width: 50px; height: 50px; border-radius: 12px; border: 5px solid rgba(250,248,244,.9); box-shadow: 0 3px 10px rgba(0,0,0,.45); position: relative; flex: none; }
.chk { position: absolute; left: 6px; top: 2px; width: 30px; height: 36px; }
#badge { position: absolute; left: 60px; top: 175px; width: 740px; height: 230px; border-radius: 115px; background: #15273f; color: #faf8f4; box-shadow: 0 16px 40px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; font-size: 84px; }
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="16.93" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="16.93" data-track-index="0"><div id="card">
<div id="hdr">What I knew how to do</div>
<div class="row" id="r0" style="top:96px"><div class="box"><svg class="chk" viewBox="0 0 30 36"><path d="M3,19 L12,29 L28,5" fill="none" stroke="#faf8f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>Fight the IRS</span></div>
<div class="row" id="r1" style="top:182px"><div class="box"><svg class="chk" viewBox="0 0 30 36"><path d="M3,19 L12,29 L28,5" fill="none" stroke="#faf8f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>Estate plans</span></div>
<div class="row" id="r2" style="top:268px"><div class="box"><svg class="chk" viewBox="0 0 30 36"><path d="M3,19 L12,29 L28,5" fill="none" stroke="#faf8f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>Set up companies</span></div>
<div class="row" id="r3" style="top:354px"><div class="box"><svg class="chk" viewBox="0 0 30 36"><path d="M3,19 L12,29 L28,5" fill="none" stroke="#faf8f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>Draft contracts</span></div>
<div class="row" id="r4" style="top:440px"><div class="box"><svg class="chk" viewBox="0 0 30 36"><path d="M3,19 L12,29 L28,5" fill="none" stroke="#faf8f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>Litigation</span></div>
<div id="badge">Business Law</div>
</div></div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
gsap.set(".chk", { opacity: 0 }); gsap.set(".row", { opacity: 0 }); gsap.set("#badge", { opacity: 0, scale: 0.5 });
tl.fromTo("#card", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" }, 0.0);
// one line at a time: each skill slides in when he starts the line, its green check ticks on the key word
const show = [0.0, 1.467, 3.067, 4.567, 6.067], tick = [0.719, 2.215, 3.882, 5.034, 9.333];   // rows land on each zoom step; check on the key word
show.forEach((t, i) => {
  tl.fromTo("#r"+i, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
  tl.to("#r"+i+" .box", { backgroundColor: "#2fb36a", borderColor: "#2fb36a", duration: 0.12 }, tick[i]);
  tl.fromTo("#r"+i+" .chk", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)", immediateRender: false }, tick[i]);
});
// "those five areas" (+15.59): all rows pulse; "coalesce" (+17.16): they slide together; "business law" (+18.64): badge
tl.to(".row", { x: 12, duration: 0.15, yoyo: true, repeat: 1 }, 13.275);
tl.to(".row", { top: 268, scale: 0.6, opacity: 0, duration: 0.6, ease: "power3.in", stagger: 0.05 }, 14.707);
tl.to("#hdr", { opacity: 0, duration: 0.3 }, 14.75);
tl.to("#badge", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 16.17);
tl.to("#card", { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, 16.73);
window.__timelines["main"] = tl;
</script></body></html>
