<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #stage { perspective: 1400px; }
.card { position: absolute; border-radius: 28px; background: #faf8f4; box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #15273f; }
.lab { font-size: 30px; letter-spacing: .12em; color: #466489; }
.red { color: #d64545; } .green { color: #2fb36a; } .navy { color: #15273f; } .muted { color: #8fa9c7; }
#card{left:140px;top:1080px;width:800px;height:330px}
#stack{position:absolute;left:60px;top:46px;width:200px;height:240px}
.pg{position:absolute;width:150px;height:196px;background:#fff;border:5px solid #15273f;border-radius:6px}
.pg i{position:absolute;left:22px;right:22px;height:6px;border-radius:3px;background:#8fa9c7}
#n{position:absolute;left:320px;top:40px;font-size:112px;line-height:1}
#nl{position:absolute;left:326px;top:150px;font-size:30px;letter-spacing:.12em;color:#466489}
#c{position:absolute;left:326px;top:206px;font-size:52px}
#stamp{position:absolute;left:300px;top:118px;padding:6px 20px;border:7px solid #d64545;border-radius:12px;color:#d64545;font-size:40px;letter-spacing:.06em;transform:rotate(-8deg);background:rgba(250,248,244,.9)}
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="4.6" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="4.6" data-track-index="0">
<div class="card" id="card"><div id="stack"></div><div id="n" class="navy">0</div><div id="nl">PAGE BRIEFS</div><div id="c" class="navy">Cost them: <span class="green">$0</span></div></div>
</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IN = (sel, t) => tl.fromTo(sel, { rotationX: 70, y: 220, scale: 0.85, opacity: 0 }, { rotationX: 0, y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
const OUT = (sel, t) => tl.to(sel, { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, t);
const POP = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, t);
const st=document.getElementById("stack");
for(let i=0;i<5;i++){st.insertAdjacentHTML("beforeend",'<div class="pg" style="left:'+(i*10)+'px;top:'+(36-i*9)+'px"><i style="top:40px"></i><i style="top:70px"></i><i style="top:100px;right:50px"></i><i style="top:130px"></i></div>');}
gsap.set(".pg",{opacity:0,y:30}); gsap.set(["#nl","#c"],{opacity:0});
IN("#card",0.0);
tl.to(".pg",{opacity:1,y:0,duration:0.18,stagger:0.12,ease:"back.out(2)"},0.35);
const o={v:0}; tl.to(o,{v:200,duration:0.7,ease:"power2.out",onUpdate:()=>{document.getElementById("n").textContent=Math.round(o.v)}},0.42);
tl.to("#nl",{opacity:1,duration:0.2},0.5);
POP("#c",3.25);
OUT("#card",4.38);
window.__timelines["main"] = tl;
</script></body></html>
