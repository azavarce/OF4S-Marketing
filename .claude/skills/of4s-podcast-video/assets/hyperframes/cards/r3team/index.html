<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'SG'; font-weight: 800; src: url('assets/schibsted-grotesk-latin-800-normal.woff') format('woff'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #main { position: relative; width: 100%; height: 100%; }
      /* floating card in the lower part of the frame: below the faces, inside the IG/TikTok safe zone */
      #card { position: absolute; left: 110px; top: 880px; width: 860px; height: 540px; border-radius: 28px; background: #faf8f4;
              box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; }
      #team { position: absolute; left: 130px; top: 20px; width: 600px; height: 420px; overflow: visible; }
      #label { position: absolute; left: 0; width: 860px; top: 438px; text-align: center; font-family: 'SG'; font-weight: 800; font-size: 60px; color: #15273f; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="1.5" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
        <div id="card">
          <svg id="team" viewBox="100 100 700 560">
            <defs><g id="p"><circle cx="0" cy="-58" r="34"/><path d="M-62,40 C-62,-6 -34,-20 0,-20 C34,-20 62,-6 62,40 Z"/></g></defs>
            <g id="links" stroke="#8fa9c7" stroke-width="5" stroke-linecap="round" opacity="0">
              <line x1="450" y1="330" x2="250" y2="200"/><line x1="450" y1="330" x2="650" y2="200"/><line x1="450" y1="330" x2="190" y2="440"/>
              <line x1="450" y1="330" x2="710" y2="440"/><line x1="450" y1="330" x2="330" y2="560"/><line x1="450" y1="330" x2="570" y2="560"/>
            </g>
            <g fill="#15273f"><g id="p0" transform="translate(450,330)"><g class="in"><use href="#p"/></g></g></g>
            <g fill="#466489">
              <g class="t" transform="translate(250,200)"><g class="in"><use href="#p"/></g></g>
              <g class="t" transform="translate(650,200)"><g class="in"><use href="#p"/></g></g>
              <g class="t" transform="translate(190,440)"><g class="in"><use href="#p"/></g></g>
              <g class="t" transform="translate(710,440)"><g class="in"><use href="#p"/></g></g>
              <g class="t" transform="translate(330,560)"><g class="in"><use href="#p"/></g></g>
              <g class="t" transform="translate(570,560)"><g class="in"><use href="#p"/></g></g>
            </g>
          </svg>
          <div id="label">Build a team</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // card pops in, one person on "build" (+0.20), the team appears on "team" (+0.54), card slips away at the end
      tl.fromTo("#card", { scale: 0.6, y: 80, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.0);
      tl.fromTo("#p0 .in", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1.15, duration: 0.22, ease: "back.out(3)", immediateRender: true }, 0.16);
      tl.to("#links", { opacity: 1, duration: 0.2 }, 0.50);
      tl.fromTo(".t .in", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.24, ease: "back.out(2.6)", stagger: 0.07 }, 0.52);
      tl.to("#p0 .in", { scale: 1, duration: 0.3, ease: "power2.out" }, 0.52);
      tl.fromTo("#label", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.56);
      tl.to("#card", { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, 1.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
