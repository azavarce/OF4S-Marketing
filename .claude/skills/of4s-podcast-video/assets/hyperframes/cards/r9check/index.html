<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #stage { perspective: 1400px; }
.card { position: absolute; border-radius: 28px; background: #faf8f4; box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #15273f; }
.lab { font-size: 30px; letter-spacing: .12em; color: #466489; }
.red { color: #d64545; } .green { color: #2fb36a; } .navy { color: #15273f; } .muted { color: #8fa9c7; }
@font-face{font-family:"SGB";font-weight:700;src:url("assets/schibsted-grotesk-latin-700-normal.woff") format("woff");}
.cl{position:absolute;left:150px;height:96px;display:flex;align-items:center;font-family:"SGB";font-weight:700;font-size:58px;color:#faf8f4;text-shadow:0 4px 16px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);white-space:nowrap}
.cl svg{width:62px;height:62px;margin-right:26px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
#l1{top:1110px} #l2{top:1206px} #l3{top:1302px}
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="5.4" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="5.4" data-track-index="0">
<div class="cl" id="l1"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="29" fill="#2fb36a"/><path d="M17,32 L27,42 L46,21" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>Individualized options</div>
<div class="cl" id="l2"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="29" fill="#2fb36a"/><path d="M17,32 L27,42 L46,21" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>Customized for our needs</div>
</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IN = (sel, t) => tl.fromTo(sel, { rotationX: 70, y: 220, scale: 0.85, opacity: 0 }, { rotationX: 0, y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
const OUT = (sel, t) => tl.to(sel, { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, t);
const POP = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, t);
gsap.set([".cl"],{opacity:0});
[["#l1",0.5],["#l2",3.2]].forEach(([s,t])=>tl.fromTo(s,{opacity:0,x:-40},{opacity:1,x:0,duration:0.3,ease:"power3.out",immediateRender:false},t));
tl.to(".cl",{opacity:0,duration:0.2},5.15);
window.__timelines["main"] = tl;
</script></body></html>
