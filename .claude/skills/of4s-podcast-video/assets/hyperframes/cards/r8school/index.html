<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #stage { perspective: 1400px; }
.card { position: absolute; border-radius: 28px; background: #faf8f4; box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #15273f; }
.lab { font-size: 30px; letter-spacing: .12em; color: #466489; }
.red { color: #d64545; } .green { color: #2fb36a; } .navy { color: #15273f; } .muted { color: #8fa9c7; }
#card{left:140px;top:1100px;width:800px;height:300px}
.col{position:absolute;top:30px;width:360px;text-align:center}
#c1{left:20px} #c2{left:420px}
.ic{width:140px;height:140px;margin:0 auto;display:block}
.t{font-size:40px;margin-top:10px}
.mk{position:absolute;top:10px;right:60px;font-size:64px;line-height:1}
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="2.6" data-track-index="0">
<div class="card" id="card">
<div class="col" id="c1"><svg class="ic" viewBox="0 0 140 140"><path d="M20,70 L70,30 L120,70 L70,105 Z" fill="none" stroke="#15273f" stroke-width="10" stroke-linejoin="round"/><path d="M38,84 L38,108 Q70,126 102,108 L102,84" fill="none" stroke="#15273f" stroke-width="10" stroke-linejoin="round"/><path d="M120,70 L120,104" stroke="#15273f" stroke-width="8" stroke-linecap="round"/></svg><div class="t navy">Law school</div><div class="mk red" id="m1">&#10005;</div></div>
<div class="col" id="c2"><svg class="ic" viewBox="0 0 140 140"><path d="M44,96 L92,48" stroke="#15273f" stroke-width="18" stroke-linecap="round"/><path d="M84,24 a26,26 0 1,0 32,32 l-14,4 -10,-10 4,-14 z" fill="#15273f"/><circle cx="40" cy="100" r="16" fill="#15273f"/></svg><div class="t navy">Plumbing school</div><div class="mk green" id="m2">&#10003;</div></div></div>
</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IN = (sel, t) => tl.fromTo(sel, { rotationX: 70, y: 220, scale: 0.85, opacity: 0 }, { rotationX: 0, y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
const OUT = (sel, t) => tl.to(sel, { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, t);
const POP = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, t);
gsap.set(["#c1","#c2","#m1","#m2"],{opacity:0});
IN("#card",0.0); POP("#c1",0.1); POP("#c2",0.55); POP("#m2",0.62);
tl.fromTo("#m1",{opacity:0,scale:2.2},{opacity:1,scale:1,duration:0.16,ease:"power4.in",immediateRender:false},1.65);
tl.to("#c1",{opacity:0.45,duration:0.2},1.8);
OUT("#card",2.38);
window.__timelines["main"] = tl;
</script></body></html>
