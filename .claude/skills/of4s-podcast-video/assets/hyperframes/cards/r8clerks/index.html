<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>@font-face { font-family: "SG"; font-weight: 800; src: url("assets/schibsted-grotesk-latin-800-normal.woff") format("woff"); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; } #main { position: relative; width: 100%; height: 100%; } #stage { perspective: 1400px; }
.card { position: absolute; border-radius: 28px; background: #faf8f4; box-shadow: 0 40px 90px rgba(15,29,51,.40), 0 8px 20px rgba(15,29,51,.20); transform-origin: 50% 70%; overflow: hidden; font-family: "SG"; font-weight: 800; color: #15273f; }
.lab { font-size: 30px; letter-spacing: .12em; color: #466489; }
.red { color: #d64545; } .green { color: #2fb36a; } .navy { color: #15273f; } .muted { color: #8fa9c7; }
#card{left:110px;top:1090px;width:860px;height:340px}
#hd{position:absolute;left:0;width:860px;top:30px;text-align:center}
#row{position:absolute;left:62px;top:84px;width:750px;height:120px}
.p{position:absolute;top:0;width:60px;height:110px}
#n{position:absolute;left:0;width:860px;top:216px;text-align:center;font-size:62px;line-height:1.1}
#n .a{color:#15273f} #n .ar{color:#8fa9c7;margin:0 18px} #n .b{color:#d64545}
#n2{position:absolute;left:0;width:860px;top:292px;text-align:center;font-size:24px;color:#466489;letter-spacing:.08em}
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="7.0" data-width="1080" data-height="1920">
<div id="stage" class="clip" data-start="0" data-duration="7.0" data-track-index="0">
<div class="card" id="card"><div id="hd" class="lab">SUMMER LAW CLERKS</div><div id="row"></div>
<div id="n"><span class="a">10</span><span class="ar">&#8594;</span><span class="b">6&#8211;7</span></div><div id="n2">LAST 5&#8211;6 SUMMERS &#8594; THIS SUMMER (PREDICTED)</div></div>
</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const IN = (sel, t) => tl.fromTo(sel, { rotationX: 70, y: 220, scale: 0.85, opacity: 0 }, { rotationX: 0, y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
const OUT = (sel, t) => tl.to(sel, { scale: 0.92, y: 30, opacity: 0, duration: 0.2, ease: "power2.in" }, t);
const POP = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, t);
const row=document.getElementById("row");
for(let i=0;i<10;i++){row.insertAdjacentHTML("beforeend",'<svg class="p" id="p'+i+'" style="left:'+(i*75)+'px" viewBox="0 0 60 110"><circle cx="30" cy="22" r="18" fill="#15273f"/><path d="M6,108 L6,66 Q6,46 30,46 Q54,46 54,66 L54,108 Z" fill="#15273f"/></svg>');}
gsap.set(".p",{opacity:0}); gsap.set(["#n .a","#n .ar","#n .b","#n2"],{opacity:0});
IN("#card",0.0);
tl.fromTo(".p",{opacity:0,y:20},{opacity:1,y:0,duration:0.22,stagger:0.08,ease:"back.out(2)",immediateRender:false},2.0);
POP("#n .a",2.85);
tl.to(["#p6","#p7","#p8","#p9"],{opacity:0.15,y:12,duration:0.3,stagger:0.08},5.85);
POP("#n .ar",5.85); POP("#n .b",6.0); tl.to("#n2",{opacity:1,duration:0.2},6.05);
OUT("#card",6.78);
window.__timelines["main"] = tl;
</script></body></html>
